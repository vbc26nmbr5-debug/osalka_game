<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Осалка</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px}.hero{padding:20px 0}.hero h1{font-size:42px;margin:5px 0}.muted{color:#9eabc8}.card{background:#151c32;border:1px solid #2b3754;border-radius:20px;padding:18px;margin:14px 0}input,button{width:100%;padding:13px;border-radius:12px;font:inherit}input{background:#0e1426;color:#fff;border:1px solid #34415f}button{border:0;background:#6c5ce7;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.secondary{background:#27324e!important}.danger{background:#e5484d!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.code{font-size:34px;letter-spacing:8px;font-weight:900;text-align:center;background:#0e1426;padding:16px;border-radius:15px}.player{display:flex;justify-content:space-between;align-items:center;background:#0e1426;padding:12px;border-radius:13px;margin:8px 0}.small{font-size:13px;color:#9eabc8}.badge{display:inline-block;background:#30275f;color:#d8d2ff;border-radius:999px;padding:6px 10px;font-size:13px}.hidden{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:35px}}</style></head>
<body><main><section class="hero"><span class="badge">🎮 Прятки без GPS</span><h1>Осалка</h1><p class="muted">Одна комната — много телефонов. Всё синхронизируется в реальном времени.</p></section>
<div id="home" class="card"><h2>Войти в игру</h2><input id="name" maxlength="20" placeholder="Твоё имя"><div class="grid"><button onclick="create()">Создать комнату</button><button class="secondary" onclick="document.querySelector('#join').classList.remove('hidden')">Войти по коду</button></div><div id="join" class="hidden"><input id="room" maxlength="5" placeholder="Код комнаты" style="margin-top:10px;text-transform:uppercase"><button onclick="join()">Войти</button></div><p id="err" class="muted"></p></div>
<div id="game" class="hidden"><div class="card"><span class="badge" id="myrole">Игрок</span><h2>Код комнаты</h2><div class="code" id="code"></div><p class="muted" style="text-align:center">Отправь код друзьям.</p></div><div class="card"><h2>Игроки</h2><div id="players"></div></div><div class="card"><h2 id="status">Ожидание игроков</h2><button id="start" onclick="start()">Начать игру</button><button id="finish" class="danger" onclick="finish()">Закончить раунд</button></div></div></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();let room="",me="",host=false,state=null;$=x=>document.getElementById(x);
function nm(){me=$("name").value.trim();if(!me){$("err").textContent="Введи имя";return false}return true}
function create(){if(!nm())return;s.emit("create",{name:me},r=>{if(!r.ok)return $("err").textContent=r.error;room=r.code;host=true;openGame()})}
function join(){if(!nm())return;s.emit("join",{name:me,code:$("room").value},r=>{if(!r.ok)return $("err").textContent=r.error;room=$("room").value.toUpperCase();openGame()})}
function openGame(){$("home").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=room}
function start(){s.emit("start")}function finish(){s.emit("finish")}
function tag(id){s.emit("tag",id)}
s.on("state",r=>{state=r;room=r.code;host=r.host===s.id;$("code").textContent=r.code;render()});
function render(){let mep=state.players.find(p=>p.id===s.id);$("myrole").textContent=mep&&mep.id===state.seeker?"👑 Ты водящий":"👤 Игрок";$("status").textContent=state.started?"Игра идёт":"Ожидание / раунд завершён";$("start").style.display=host?"block":"none";$("finish").style.display=host&&state.started?"block":"none";
$("players").innerHTML=state.players.map(p=>`<div class="player"><div><b>${esc(p.name)}</b><div class="small">${p.id===state.seeker?"👑 Водящий":p.tagged?"Осален":"Прячется"}</div></div>${state.started&&(host||s.id===state.seeker)&&p.id!==state.seeker&&!p.tagged?`<button style="width:auto;margin:0" onclick="tag('${p.id}')">Осалить</button>`:""}</div>`).join("")}
function esc(x){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
